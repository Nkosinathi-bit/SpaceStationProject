name: Build and check simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@v3
      - name: Build .NET Framework solution
        run: msbuild SpaceStation.sln /restore /p:Configuration=Release /m /verbosity:minimal
      - name: Check console lifecycle
        run: python .github/scripts/check-console.py src/SpaceStationSimulator/bin/Release/SpaceStationSimulator.exe
